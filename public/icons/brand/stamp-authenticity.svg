<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none" stroke="currentColor">
  <defs>
    <!-- Upper circular path for text -->
    <path id="upper-arc" d="M 40 150 A 110 110 0 1 1 260 150" />
    <!-- Lower circular path for text -->
    <path id="lower-arc" d="M 260 150 A 110 110 0 0 1 40 150" />
  </defs>

  <!-- Outer rings -->
  <circle cx="150" cy="150" r="140" stroke-width="2" />
  <circle cx="150" cy="150" r="134" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="150" cy="150" r="88" stroke-width="1.5" />

  <!-- Circular text -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="currentColor" stroke="none">
    <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">
      LANA GOMEZ • STUDIO OF ART
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="currentColor" stroke="none">
    <textPath href="#lower-arc" startOffset="50%" text-anchor="middle">
      ORIGINAL ATELIER • EST. 2026
    </textPath>
  </text>

  <!-- Center Monogram -->
  <g transform="translate(150, 150) scale(0.65) translate(-120, -120)">
    <!-- Letter L -->
    <path d="M 90 75 L 90 160 C 90 163 92 165 95 165 L 140 165" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 80 75 L 100 75" stroke-width="5" stroke-linecap="round" />

    <!-- Letter G -->
    <path d="M 160 90 C 148 74 128 68 108 74 C 86 80 72 100 72 120 C 72 144 88 168 116 168 C 142 168 164 150 164 125 L 122 125" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 164 116 L 164 134" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>

