  <circle cx="120" cy="120" r="102" stroke-width="1.5" />
  <circle cx="120" cy="120" r="95" stroke-width="0.75" opacity="0.6" />

  <!-- Four cardinal accent diamonds -->
  <path d="M 120 28 L 123 33 L 120 38 L 117 33 Z" fill="currentColor" />
